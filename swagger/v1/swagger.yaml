        '200':
          description: Данные профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      summary: Обновить профиль пользователя
      description: |
        При изменении паспортных данных (`passport`) обязательны `verification_id` (из `POST /api/v1/a1/request`)
        и `code` (последние 4 цифры входящего номера). Без успешной проверки кода паспорт не сохраняется.
      tags:
        - Account
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdate'
      responses:
        '200':
          description: Профиль обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Неверный или просроченный код подтверждения паспорта
        '422':
          description: Нет кода подтверждения или ошибка валидации паспорта

  /api/v1/account/profile/change_phone_request:
    post:
      summary: Запросить смену номера телефона
      tags:
        - Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, example: "375291112233" }
      responses:
        '200':
          description: Код отправлен
        '422':
          description: Ошибка (номер занят или неверный формат)

  /api/v1/account/profile/change_phone_verify:
    post:
      summary: Подтвердить смену номера телефона
      tags:
        - Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, description: "Последние 4 цифры входящего номера" }
      responses:
        '200':
          description: Номер изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Неверный код

  /api/v1/account/profile/change_email_verify:
    post:
      summary: Подтвердить смену email
      tags:
        - Account
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string }
                code: { type: string, description: "Код из письма (для теста: 1234)" }
      responses:
        '200':
          description: Email изменен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          description: Неверный код

  /api/v1/account/purchases:
    get:
      summary: Список покупок (товаров из завершенных заказов)
      tags:
        - Account
      security:
        - BearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, price_asc, price_desc]
        - name: page
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: Список купленных товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  purchases:
                    type: array
                    items:
                      $ref: '#/components/schemas/PurchaseItem'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/account/receipts:
    get:
      summary: Список электронных чеков
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список чеков по заказам
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderReceipts'

  /api/v1/account/returns:
    post:
      summary: Создание возврата
      tags:
        - Return Requests
      security:
        - bearerAuth: []
      consumes:
        - multipart/form-data
      produces:
        - application/json
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - order_id
                - last_name
                - first_name
                - phone
                - email
                - reason
                - compensation_type
              properties:
                order_id:
                  type: string
                  description: Номер заказа, 6–10 цифр
                  example: "4940891"
                last_name:
                  type: string
                  example: "Тест"
                first_name:
                  type: string
                  example: "Тест"
                patronymic:
                  type: string
                  nullable: true
                  example: "Тестович"
                phone:
                  type: string
                  example: "+375259340284"
                email:
                  type: string
                  format: email
                  example: "dsuschinsky@gmail.com"
                reason:
                  type: string
                  enum: [damaged, wrong, quality, description, other]
                  example: "wrong"
                  description: Причина возврата
                comment:
                  type: string
                  nullable: true
                  example: "текст комментария"
                  description: Только комментарий клиента
                compensation_type:
                  type: string
                  enum: [refund, exchange]
                  example: "exchange"
                attachments[]:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Фото до 5 файлов (.avif, .heic, .heif, .webp, .jpeg, .png)
      responses:
        '201':
          description: Возврат создан
        '401':
          description: Не авторизован
        '404':
          description: Заказ не найден
        '422':
          description: Ошибка валидации

  /api/v1/cooperation_requests:
    post:
      summary: Отправить заявку на сотрудничество
      description: |
        Публичная форма «Сотрудничество» (без JWT). Создаёт заявку в базе и ставит фоновую задачу синхронизации с AmoCRM.

        **Обязательные поля:** `first_name`, `last_name`, `email`, `phone`, `city`, `cooperation_type`, `comment`, `personal_data_consent`.
        Поля `company` и `marketing_email_consent` — опциональные.

        **Важно:** ответ `201` подтверждает сохранение заявки в приложении; доставка в CRM выполняется асинхронно (по очереди).
      tags:
        - Forms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CooperationRequestCreatePayload'
      responses:
        '201':
          description: Заявка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CooperationRequestCreateResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrors'

  /api/v1/homepage/slider/main:
    get:
      summary: Баннеры основной секции главной страницы
      description: |
        Возвращает активные баннеры секции "Главный баннер" для главной страницы.
        Баннеры фильтруются по активному статусу (active = true) и отсортированы по позиции.
        Доступные варианты размеров: 1500×516, 572×594
      tags:
        - Homepage
      responses:
        '200':
          description: Список активных баннеров основной секции
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HomeBanner'
                  meta:
                    type: object
                    properties:
                      seo:
                        $ref: '#/components/schemas/SeoMeta'
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/homepage/slider/banners:
    get:
      summary: Горизонтальынй баннер дополнительной секции главной страницы
      description: |
        Возвращает активные Горизонтальынй баннер секции "Баннеры" для главной страницы.
        Горизонтальынй баннер фильтруются по активному статусу (active = true) и отсортированы по позиции.
        Доступные варианты размеров: 1500×256, 742×256
      tags:
        - Homepage
      responses:
        '200':
          description: Список активных баннеров дополнительной секции
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/HomeBanner'
        '500':
          description: Внутренняя ошибка сервера


  /api/v1/homepage/recommendations:
    get:
      summary: Рекомендации товаров для главной страницы
      description: |
        Возвращает список товаров, настроенных в админке для блока рекомендаций на главной странице.
        Источник рекомендаций определяется настройкой `homepage` и может быть задан:
        - списком SKU в нужном порядке;
        - категорией товаров.

        Если источник задан через SKU, порядок товаров сохраняется таким, как он указан в настройке.
        Если источник задан через категорию, товары выбираются из указанной категории и сортируются по имени.
        Параметр `per_page` ограничивает количество возвращаемых товаров.
      tags:
        - Homepage
      parameters:
        - name: per_page
          in: query
          description: Количество товаров в ответе. По умолчанию 8, допустимый диапазон от 1 до 24.
          schema:
            type: integer
            default: 8
            minimum: 1
            maximum: 24
      responses:
        '200':
          description: Список товаров для блока рекомендаций главной страницы
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'
                  meta:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 8
                      placement:
                        type: string
                        example: homepage
        '500':
          description: Внутренняя ошибка сервера

  /api/v1/search/autocomplete:
    get:
      summary: Лёгкий autocomplete для поисковой строки
      description: >
        Быстрый endpoint для dropdown-подсказок. Не возвращает фильтры, пагинацию,
        полные карточки товаров, пошлины и промо. Для полной страницы результатов
        используйте /api/v1/search/suggest.
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Строка поиска. До 2 символов backend возвращает пустые массивы.
      responses:
        '200':
          description: Короткие подсказки, категории и товары для dropdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchAutocompleteResponse'

  /api/v1/search/suggest:
    get:
      summary: Полная поисковая выдача с фильтрами и пагинацией
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: 'Полная выдача поиска: подсказки, категории, товары, фильтры, популярные запросы и meta'
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string
                  categories:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
                  products:
                    type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Product'
                  popular_queries:
                    type: array
                    items:
                      $ref: '#/components/schemas/PopularSearchQuery'

  /api/v1/content/articles:
    get:
      summary: Список статей Tips & Ideas и News
      tags:
        - Content
      parameters:
        - name: content_type
          in: query
          schema:
            type: string
            enum: [tips_ideas, news]
          description: Тип контента, по умолчанию возвращаются оба
        - name: rubric
          in: query
          schema:
            type: string
          description: Фильтр по рубрике
        - name: component
          in: query
          schema:
            type: string
          description: Фильтр по компоненту
        - name: project
          in: query
          schema:
            type: string
          description: Фильтр по проекту
        - name: pinned_only
          in: query
          schema:
            type: boolean
          description: Отображать только закрепленные статьи
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Пагинируемый список активных и опубликованных статей
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentArticle'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/content/articles/{slug}:
    get:
      summary: Подробная статья по slug
      tags:
        - Content
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Полный контент статьи
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ContentArticle'
        '404':
          description: Статья не найдена

  /api/v1/content/legal_pages:
    get:
      summary: Список опубликованных правовых страниц
      description: |
        Возвращает только страницы со статусом «Опубликовано», отсортированные по **id** (порядок создания записей).
        Черновики и страницы со статусом «Выключено» в API не отдаются.
      tags:
        - Content
      responses:
        '200':
          description: Список правовых страниц (формат JSON:API)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegalPage'

  /api/v1/content/legal_pages/{slug}:
    get:
      summary: Правовая страница по slug
      description: |
        Полные данные страницы, включая HTML-текст в **body**.
        Доступна только **опубликованная** страница; черновик или выключенная запись — ответ 404.
      tags:
        - Content
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          description: ЧПУ страницы (латиница), например `personal-data-consent-ikeya-by`
      responses:
        '200':
          description: Правовая страница с телом документа
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LegalPage'
        '404':
          description: Страница не найдена или недоступна (не опубликована)


  /api/v1/account/reviews/available:
    get:
      summary: Товары, доступные для отзыва
      tags:
        - Reviews
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Список SKU, названий и изображений для доступных товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        sku:
                          type: string
                        name:
                          type: string
                        images:
                          type: array
                          items:
                            type: string
                        local_images:
                          type: array
                          items:
                            type: string

  /api/v1/account/reviews:
    get:
      summary: Отзывы пользователя
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, published, rejected, hidden]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Пагинируемый список отзывов пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Review'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/products/{product_sku}/reviews:
    get:
      summary: Список опубликованных отзывов товара
      description: |
        Публичный эндпоинт для вкладки отзывов в карточке товара.
        Возвращает список отзывов с пагинацией, агрегаты рейтинга (как на карточке товара),
        распределение оценок и общую ленту фото из отзывов.
      tags:
        - Reviews
      parameters:
        - name: product_sku
          in: path
          required: true
          schema:
            type: string
          description: SKU товара (как в URL карточки)
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
          description: Фильтр по оценке
        - name: with_photo
          in: query
          schema:
            type: boolean
          description: Только отзывы с фотографиями
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, oldest, rating_high, rating_low, helpful]
            default: newest
          description: Сортировка (закреплённые отзывы всегда выше)
      responses:
        '200':
          description: Список отзывов и агрегаты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductReviewsIndexResponse'
        '404':
          description: Товар не найден
    post:
      summary: Создать отзыв на купленный товар
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: product_sku
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Отзыв отправлен на модерацию
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '422':
          description: Ошибка валидации (например, товар не куплен или рейтинг вне диапазона)

  /api/v1/reviews/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      summary: Обновить отзыв до модерации
      tags:
        - Reviews
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewUpdateInput'
      responses:
        '200':
          description: Отзыв отредактирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '422':
          description: Редактирование после модерации недоступно
    delete:
      summary: Удалить отзыв (soft delete после публикации)
      tags:
        - Reviews
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Отзыв скрыт или удалён

  /api/v1/reviews/{id}/helpful:
    post:
      summary: Поставить полезность опубликованному отзыву
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Количество голосов "полезно"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewHelpfulResponse'
        '404':
          description: Отзыв не найден или не опубликован
    delete:
      summary: Убрать полезность отзыва
      tags:
        - Reviews
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Голос удалён

  /reviews/export:
    get:
      summary: Экспорт отзывов (CSV/JSON)
      tags:
        - Reviews
      security:
        - BearerAuth: []
      description: |
        Доступны форматы CSV и JSON. JSON отдаёт массив объектов, CSV содержит перечисленные поля в шапке.
      responses:
        '200':
          description: Экспортированные отзывы
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReviewExportEntry'
        '403':
          description: Недостаточно прав (только для админов)

components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        attributes:
          type: object
          properties:
            sku:
              type: string
            unique_id:
              type: integer
            item_no:
              type: string
            url:
              type: string
            name:
              type: string
            name_ru:
              type: string
            collection:
              type: string
            price:
              type: number
            quantity:
              type: integer
            weight:
              type: number
            net_weight:
              type: number
            package_volume:
              type: number
            package_dimensions:
              type: string
            dimensions:
              type: string
            is_parcel:
              type: boolean
            is_bestseller:
