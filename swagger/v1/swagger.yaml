  /api/v1/checkout:
    post:
      summary: Оформить заказ
      tags:
        - Checkout
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - full_name
                - phone
                - delivery_type
                - payment_method
              properties:
                full_name:
                  type: string
                  example: "Иван Иванов"
                phone:
                  type: string
                  example: "375291234567"
                delivery_type:
                  type: string
                  enum: [pickup, europost_pickup, courier, ikeya_delivery]
                  description: "pickup — deprecated alias, backend нормализует его в europost_pickup."
                  examples:
                    europost_pickup: { value: "europost_pickup" }
                    courier: { value: "courier" }
                    ikeya_delivery: { value: "ikeya_delivery" }
                payment_method:
                  type: string
                  enum: [card, installment, qr, erip, oplati]
                  description: "card (карта онлайн), installment (рассрочка), qr (QR-код), erip (ЕРИП), oplati (Оплати)"
                pickup_point_id:
                  type: integer
                  description: "ID ПВЗ (обязательно для delivery_type=europost_pickup; legacy pickup также поддержан и нормализуется)"
                a1_verification_id:
                  type: string
                  description: "ID верификации A1 (обязательно при изменении паспорта, может быть получено из профиля)"
                address:
                  type: object
                  properties:
                    city:
                      type: string
                    street:
                      type: string
                    house:
                      type: string
                    apartment:
                      type: string
                    is_private_house:
                      type: boolean
                      example: true
                    entrance:
                      type: string
                      nullable: true
                    floor:
                      type: string
                      nullable: true
                    has_elevator:
                      type: boolean
                      nullable: true
                    intercom:
                      type: string
                      nullable: true
                passport:
                  type: object
                  properties:
                    passport_number:
                      type: string
                      example: "MP1234567"
                    full_name:
                      type: string
                    issue_date:
                      type: string
                      format: date
                services:
                  type: array
                  items:
                    type: string
                  example: ["Сборка", "Подъем на этаж"]
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  order_id:
                    type: integer
                  order:
                    $ref: '#/components/schemas/Order'
        '401':
          description: Необходима авторизация
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                  passport_data:
                    type: object
                  a1_verification_id:
                    type: string
  /api/v1/payment_links/{id}:
    get:
      summary: Перенаправить на Webpay
      description: |
        Валидирует `token` и `payment_expires_at`, затем возвращает HTML-форму, которая сразу POST-ится на `wsb_payment_page`.
        Ссылка действительна 30 минут после создания, далее возвращает `410`.
      tags:
        - Checkout
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML-форма Webpay, транслирующая пользователя на платёжную страницу
          content:
            text/html:
              schema:
                type: string
                format: html
        '403':
          description: Токен не совпадает
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '404':
          description: Заказ не найден
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '410':
          description: Ссылка устарела
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /api/v1/delivery/types:
    get:
      summary: Получить доступные типы доставки и провайдеров
      tags:
        - Delivery
      responses:
        '200':
          description: Список типов и провайдеров
          content:
            application/json:
              schema:
                type: object
                properties:
                  types:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        name: { type: string }
                  providers:
                    type: array
                    items: { type: string }

  /api/v1/delivery/europost_offices:
    get:
      summary: Получить список отделений Европочты
      tags:
        - Delivery
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: integer
            enum: [1, 3, 4]
          description: "Фильтр типа ПВЗ для GET https://api-kassa.evropochta.by/api/external/stores (1 — ОПС, 3 — склад, 4 — ОПС при складе). Нужны EUROPOST_API_TOKEN и корректный EUROPOST_API_BASE_URL (по умолчанию https://api-kassa.evropochta.by)."
        - name: order_id
          in: query
          required: false
          schema:
            type: integer
          description: Черновик checkout — фильтрация по составу заказа.
        - name: cart_token
          in: query
          required: false
          schema:
            type: string
          description: Гостевая/пользовательская корзина.
        - name: items
          in: query
          required: false
          schema:
            type: string
          description: JSON-массив [{sku, quantity}] для subset корзины (вместе с cart_token).
      description: |
        Без order_id / cart_token / items — публичный каталог всех ПВЗ (страница /pvz, карта в ЛК).
        С контекстом корзины или черновика — только подходящие по ВГХ офисы с ценами доставки.
      responses:
        '200':
          description: Список отделений Европочты
          content:
            application/json:
              examples:
                cart_filtered:
                  summary: ПВЗ с ETA/storage/prices
                  value:
                    offices:
                      - id: 10
                        provider: europost
                        external_id: "12345"
                        city: "Минск"
                        address: "пр-т Пушкина, д. 28"
                        working_hours: "Пн-Вс 10:00-21:00"
                        lat: 53.9123
                        lng: 27.4567
                        available_for_cart: true
                        delivery_date: "2026-05-12"
                        storage_until: "2026-05-26"
                        delivery_price_byn: "8.00"
                        delivery_to_belarus_price_byn: "80.00"
                        total_delivery_price_byn: "88.00"
              schema:
                type: object
                properties:
                  offices:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/EuropostOffice'
                        - $ref: '#/components/schemas/EuropostOfficeForCart'

  /api/v1/delivery/calculate:
    post:
      summary: Расчет стоимости и доступности доставки
      tags:
        - Delivery
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: integer
                  description: Черновик checkout (приоритет над cart_token)
                cart_token:
                  type: string
                delivery_type:
                  type: string
                  enum: [pickup, europost_pickup, courier, ikeya_delivery]
                  description: "pickup — deprecated alias, backend нормализует его в europost_pickup."
                  examples:
                    pickup_alias: { value: "pickup" }
                    europost_pickup: { value: "europost_pickup" }
                    courier: { value: "courier" }
                    ikeya_delivery: { value: "ikeya_delivery" }
                pickup_point_id:
                  type: integer
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      sku: { type: string }
                      quantity: { type: integer }
      responses:
        '200':
          description: Результат расчета
          content:
            application/json:
              schema:
                type: object
                properties:
                  basis:
                    type: object
                    properties:
                      total_weight_kg: { type: number }
                      total_volume_m3: { type: number }
                      subtotal_byn: { type: string }
                  delivery:
                    type: object
                    properties:
                      type: { type: string }
                      base_cost_byn: { type: string, description: "Сумма внутренних таблиц PL→BY (PolandDelivery + BelarusDelivery) в BYN." }
                      pricing:
                        type: object
                        description: "Источник цены и разбивка; для europost_pickup сегмент почты может браться из API Европочты."
                        properties:
                          source:
                            type: string
                            enum:
                              - europost_api
                              - internal_weight_tables
                              - internal_ikeya_poland_zero
                              - internal_europost_token_missing
                              - internal_europost_fallback
                          internal:
                            type: object
                            properties:
                              poland_delivery_byn: { type: string }
                              belarus_delivery_byn: { type: string }
                              total_delivery_byn: { type: string }
                          europost:
                            type: object
                            nullable: true
                            properties:
                              success: { type: boolean }
                              reason: { type: string, nullable: true }
                              error: { type: string, nullable: true }
                              postal_total_byn: { type: string, nullable: true }
                              currency: { type: string, nullable: true }
                              request_payload:
                                type: object
                                additionalProperties: true
                                nullable: true
                      free_delivery_eligible: { type: boolean }
                  pickup_point:
                    allOf:
                      - $ref: '#/components/schemas/PickupPoint'
                      - type: object
                        properties:
                          eligible: { type: boolean }
                          reasons:
                            type: array
                            items: { type: string }

