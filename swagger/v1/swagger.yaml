openapi: '3.0.1'
info:
  title: IKEA API
  version: v1
  description: |
    API для работы с данными IKEA парсера.
    
    ## Аутентификация
    Большинство эндпоинтов для получения данных (товары, категории, главная страница) являются **публичными** и не требуют токена.
    
     JWT токен в заголовке `Authorization: Bearer <token>` требуется только для действий, связанных с пользователем (отзывы, личный кабинет).
    
    ## Верификация паспортных данных
    Процесс верификации паспортных данных включает следующие этапы:
    1. **Запрос звонка:** `POST /api/v1/a1/request` — пользователь получает `verification_id`.
    2. **Сохранение с подтверждением:** `PATCH /api/v1/account/profile` с полями `passport`, `verification_id` и `code` (последние 4 цифры входящего номера). Паспорт сохраняется в БД только при верном коде; при неверном коде данные не записываются.
    3. **Проверка статуса:** `GET /api/v1/account/profile` — поле `passport_verified`.
    4. **Верификация при оформлении заказа:** `POST /api/v1/checkout` — при изменении паспорта в заказе требуется подтверждение через A1 (см. параметры checkout).
    
    **Публичные эндпоинты (Без токена):**
    - `GET /api/v1/products` — Список товаров
    - `GET /api/v1/products/{sku}` — Карточка товара
    - `GET /api/v1/products/{product_sku}/reviews` — Отзывы товара (пагинация, фильтры, агрегаты)
    - `GET /api/v1/products/bestsellers` — Бестселлеры
    - `GET /api/v1/products/popular` — Популярные товары
    - `GET /api/v1/products/categories` — Категории по коллекции
    - `GET /api/v1/categories` — Категории
    - `GET /api/v1/categories/top` — Категории для верхнего меню
    - `GET /api/v1/categories/{id}/products` — Товары в категории
    - `GET /api/v1/homepage/slider/main` — Слайдер на главной
    - `GET /api/v1/homepage/recommendations` — Рекомендации товаров для главной страницы
    - `POST /api/v1/auth/login` — Вход (только для админов/менеджеров)
    - `POST /api/v1/auth/phone/check` — Проверка, существует ли номер телефона в базе
    - `POST /api/v1/auth/phone/send` — Запрос звонка для входа/регистрации
    - `POST /api/v1/auth/phone/verify` — Подтверждение кода из звонка (вход/регистрация)
    - `GET /api/v1/favorites` — Список избранного (поддержка гостевых токенов)
    - `POST /api/v1/favorites` — Добавление в избранное (поддержка гостевых токенов)
    
    **Приватные эндпоинты (Требуется Bearer Token):**
    - `POST /api/v1/products/{sku}/reviews` — Оставить отзыв
    - `GET /api/v1/account/reviews` — Мои отзывы
    - `PATCH/DELETE /api/v1/reviews/{id}` — Управление своими отзывами
    - `GET /api/v1/account/returns` — Список заявок на возврат
    - `POST /api/v1/account/returns` — Создать заявку на возврат по заказу
    
    **Избранное (Favorites):**
    - `GET /api/v1/favorites` — Список избранного
    - `POST /api/v1/favorites` — Добавить в избранное
    - `DELETE /api/v1/favorites/{sku}` — Удалить из избранного
    
    Получить токен можно через `/api/v1/auth/login`


servers:
  - url: https://ikeya.by
    description: Production server (IP)
  - url: http://localhost:3000
    description: Development server

paths:
  /api/v1/products:
    get:
      summary: Список товаров
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: category_id
          in: query
          schema:
            type: string
        - name: is_bestseller
          in: query
          schema:
            type: boolean
        - name: is_popular
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          description: |
            Сортировка товаров:
            - `rating` — по рейтингу
            - `cheapest` — сначала более дешёвые
            - `expensive` — сначала более дорогие
          schema:
            type: string
            enum: [rating, cheapest, expensive]
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/products/{sku}:
    get:
      summary: Получить товар по SKU
      tags:
        - Products
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Данные товара в подробной форме, включая breadcrumbs, если они доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'
        '404':
          description: Товар не найден

  /api/v1/products/bestsellers:
    get:
      summary: Хиты продаж
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список хитов продаж
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'

  /api/v1/products/new_arrivals:
    get:
      summary: Новинки
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список новинок
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'

  /api/v1/products/recommended:
    get:
      summary: Рекомендованные товары
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список рекомендованных товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'

  /api/v1/products/popular:
    get:
      summary: Популярные товары
      tags:
        - Products
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список популярных товаров
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'

  /api/v1/products/categories:
    get:
      summary: Получить список категорий по названию коллекции (временно не используется)
      deprecated: true
      tags:
        - Products
      parameters:
        - name: collection
          in: query
          required: true
          description: Название коллекции (например, MALM)
          schema:
            type: string
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '400':
          description: Ошибка в параметрах (отсутствует collection)

  /api/v1/categories:
    get:
      summary: Список категорий
      tags:
        - Categories
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: is_popular
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
                  meta:
                    $ref: '#/components/schemas/Meta'

  /api/v1/categories/top:
    get:
      summary: Категории для верхнего меню (хедер)
      tags:
        - Categories
      responses:
        '200':
          description: Список категорий для верхнего меню
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /api/v1/categories/{id}:
    get:
      summary: Получить категорию по ID
      tags:
        - Categories
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Category'

  /api/v1/categories/{id}/products:
    get:
      summary: Список товаров в категории
      tags:
        - Categories
      description: |
        Возвращает товары категории и метаданные с доступными фильтрами.

        ## Как фильтровать
        1) Получите категорию и её `available_filters` (из `GET /api/v1/categories` или `GET /api/v1/categories/{id}`).
        2) Отправляйте выбранные значения в query через `filters[PARAMETER][]=VALUE_ID`.

        - `PARAMETER` — это `available_filters[].parameter`
        - `VALUE_ID` — это `available_filters[].values[].id`

        ## Пример
        `/api/v1/categories/700403/products?filters[f-type][]=50310&filters[f-price-buckets][]=PRICE_19900_19901`

        ## Логика
        - между разными параметрами фильтров используется AND
        - внутри одного параметра используется OR
      parameters:
        - name: id
          in: path
          required: true
          description: IKEA ID категории
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
        - name: min_price
          in: query
          description: |
            Минимальная витринная цена в BYN (>=), та же формула, что в `price_byn` у товара.
            Можно передать только `min_price` (без `max_price`) — «от …».
          schema:
            type: number
        - name: max_price
          in: query
          description: |
            Максимальная витринная цена в BYN (<=), та же формула, что в `price_byn` у товара.
            Можно передать только `max_price` (без `min_price`) — «до …».
          schema:
            type: number
        - name: sort
          in: query
          description: |
            Сортировка товаров:
            - `popular` — популярные (по внутренней логике)
            - `newest` — новинки
            - `cheapest` — сначала более дешёвые
            - `expensive` — сначала более дорогие
          schema:
            type: string
            enum: [popular, newest, cheapest, expensive]
        - name: filters
          in: query
          description: |
            Фильтры по available_filters.
            Формат: filters[PARAMETER][]=VALUE_ID
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        - name: favorite_token
          in: query
          description: Токен гостевого списка избранного
          schema:
            type: string
        - name: X-Favorite-Token
          in: header
          description: Токен гостевого списка избранного
          schema:
            type: string
      responses:
        '200':
          description: Список товаров категории
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductTeaser'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '404':
          description: Категория не найдена

  /api/v1/categories/popular:
    get:
      summary: Популярные категории
      tags:
        - Categories
      responses:
        '200':
          description: Список популярных категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryPopular'

  /api/v1/categories/top:
    get:
      summary: ТОП-категории
      tags:
        - Categories
      responses:
        '200':
          description: Список ТОП-категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryTop'

  /api/v1/categories/custom:
    get:
      summary: Кастомные категории (Спецпредложения)
      tags:
        - Categories
      responses:
        '200':
          description: Список кастомных категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'

  /api/v1/categories/tree:
    get:
      summary: Дерево категорий
      tags:
        - Categories
      responses:
        '200':
          description: Иерархическое дерево категорий
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CategoryTree'

  /api/v1/auth/login:
    post:
      summary: Вход в систему (JWT) — только для персонала
      description: Вход по паролю разрешен только пользователям с ролями admin или manager. Обычные пользователи должны использовать вход по номеру телефона.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  description: Username, Email или Телефон
                password:
                  type: string
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Неверные учетные данные
        '403':
          description: Доступ запрещен (для обычных пользователей)

  /api/v1/auth/phone/check:
    post:
      summary: Проверить, существует ли номер телефона
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "375291234567"
      responses:
        '200':
          description: Результат проверки номера телефона
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone:
                    type: string
                    example: "375291234567"
                  exists:
                    type: boolean
                    example: true
        '422':
          description: Неверный формат телефона
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Неверный формат телефона

  /api/v1/auth/phone/send:
    post:
      summary: Запросить звонок для подтверждения телефона
      description: Инициирует звонок на указанный номер. Кодом подтверждения являются последние 4 цифры входящего номера.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  example: "375291234567"
      responses:
        '200':
          description: Звонок инициирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/v1/auth/phone/verify:
    post:
      summary: Подтвердить код и войти/зарегистрироваться
      description: Если пользователь с таким телефоном не существует, он будет создан. В этом случае поле username обязательно.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
                  description: Последние 4 цифры номера входящего звонка
                username:
                  type: string
                  description: Имя пользователя (обязательно при регистрации)
                email:
                  type: string
                  description: Email пользователя (необязательно)
                cart_token:
                  type: string
                  description: Опциональный токен гостевой корзины для привязки к пользователю
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  is_new:
                    type: boolean
        '201':
          description: Пользователь успешно зарегистрирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  is_new:
                    type: boolean
        '401':
          description: Неверный или просроченный код
        '422':
          description: Ошибка валидации (например, не указано имя при регистрации)

  /api/v1/auth/register:
    post:
      summary: Регистрация (Устарело)
      description: Данный метод отключен. Используйте подтверждение по телефону (/api/v1/auth/phone/verify) для регистрации.
      deprecated: true
      tags:
        - Authentication
      responses:
        '405':
          description: Метод не разрешен

  /api/v1/cart:
    get:
      summary: Получить содержимое корзины
      tags:
        - Cart
      parameters:
        - name: cart_token
          in: query
          schema:
            type: string
        - name: promo_code
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Данные корзины
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
    delete:
      summary: Полная очистка корзины
      tags:
        - Cart
      parameters:
        - name: cart_token
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Пустая корзина
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'

  /api/v1/cart_items:
    post:
      summary: Добавить товар в корзину
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - quantity
              properties:
                sku:
                  type: string
                quantity:
                  type: integer
                cart_token:
                  type: string
      responses:
        '200':
          description: Обновленная корзина
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
    delete:
      summary: Массовое удаление товаров из корзины
      tags:
        - Cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                skus:
                  type: array
                  items:
                    type: string
                delete_all:
                  type: boolean
                cart_token:
                  type: string
      responses:
        '200':
