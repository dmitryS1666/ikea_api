name: Frontend CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-cicd.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --watch=false

      - name: Build frontend
        run: npm run build

      - name: Setup SSH key
        env:
          FRONT_SSH_PRIVATE_KEY: ${{ secrets.FRONT_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$FRONT_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$FRONT_SSH_HOST" >> ~/.ssh/known_hosts
        working-directory: .

      - name: Sync dist to server
        env:
          FRONT_SSH_USER: ${{ secrets.FRONT_SSH_USER }}
          FRONT_SSH_HOST: ${{ secrets.FRONT_SSH_HOST }}
          FRONT_DEPLOY_PATH: ${{ secrets.FRONT_DEPLOY_PATH }}
        run: |
          rsync -avz --delete ./dist/ "${FRONT_SSH_USER}@${FRONT_SSH_HOST}:${FRONT_DEPLOY_PATH}/"

      - name: Reload frontend process
        env:
          FRONT_SSH_USER: ${{ secrets.FRONT_SSH_USER }}
          FRONT_SSH_HOST: ${{ secrets.FRONT_SSH_HOST }}
          FRONT_RELOAD_CMD: ${{ secrets.FRONT_RELOAD_CMD }}
        run: |
          ssh "${FRONT_SSH_USER}@${FRONT_SSH_HOST}" "${FRONT_RELOAD_CMD}"
        working-directory: .
